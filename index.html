<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid: speaking gym</title>
<meta name="theme-color" content="#3D2BF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lucid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF4; --surface:#FFFFFF; --surface2:#F5F6FA; --ink:#151A3A; --muted:#5B6180; --line:#D9DCE8;
  --accent:#3D2BF5; --accent-ink:#FFFFFF; --accent-soft:#E6E3FF; --signal:#FFB020; --signal-soft:#FFF1D6;
  --good:#0F8F6A; --good-soft:#DDF3EB; --bad:#D93F45; --bad-soft:#FBE2E3;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1126; --surface:#181C3A; --surface2:#1F2447; --ink:#E9EBF8; --muted:#9AA0C3; --line:#2C3263;
    --accent:#8577FF; --accent-ink:#0E1126; --accent-soft:#2A2760; --signal:#FFB84D; --signal-soft:#3A2E17;
    --good:#3DD6A3; --good-soft:#123A30; --bad:#FF6B70; --bad-soft:#3E1C24; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1126; --surface:#181C3A; --surface2:#1F2447; --ink:#E9EBF8; --muted:#9AA0C3; --line:#2C3263;
  --accent:#8577FF; --accent-ink:#0E1126; --accent-soft:#2A2760; --signal:#FFB84D; --signal-soft:#3A2E17;
  --good:#3DD6A3; --good-soft:#123A30; --bad:#FF6B70; --bad-soft:#3E1C24; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-0.02em}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;border:1px solid var(--line)}
.card.flat{background:var(--surface2);border:none}
.card.hero{background:var(--accent);color:var(--accent-ink);border:none}
.card.hero .muted{color:inherit;opacity:.8}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:14px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.warn{background:var(--signal);color:#1b1400}
.btn.inv{background:var(--accent-ink);color:var(--accent)}
.btn:disabled{opacity:.45}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.item:focus-visible,.navb:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sig{background:var(--signal-soft);color:var(--ink)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:1.25rem;flex:none}
.item.done{opacity:.6}
.item.done .ic{background:var(--good-soft)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.nav[hidden]{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.navb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 12px;border-radius:12px}
.navb .g{font-size:1.25rem}
.navb.on{color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:var(--surface2);border-radius:var(--r-md);padding:12px}
.metric .v{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.metric .l{font-size:.8rem;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bignum{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1;letter-spacing:-0.04em}
.stage{min-height:calc(100vh - 60px);display:flex;flex-direction:column;gap:16px}
.topicbox{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.2}
.ringwrap{display:grid;place-items:center;padding:8px 0}
.ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--surface);border:1px solid var(--line)}
.ring .pulse{position:absolute;inset:0;border-radius:50%;border:6px solid var(--accent);transform:scale(1);transition:transform .08s linear, border-color .15s}
.ring.flash .pulse{border-color:var(--signal)}
.ring .time{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:-0.04em}
.ring .sub{font-size:.8rem;color:var(--muted);text-align:center}
.live{background:var(--surface2);border-radius:var(--r-md);padding:12px;min-height:84px;max-height:170px;overflow:auto;font-size:.95rem}
.live mark{background:var(--signal-soft);color:var(--ink);border-radius:4px;padding:0 2px}
.live mark.ban{background:var(--bad-soft)}
.flashbar{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 var(--signal);transition:box-shadow .12s;z-index:30}
.flashbar.on{box-shadow:inset 0 0 0 10px var(--signal)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.85rem;font-weight:600}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px}
textarea{min-height:140px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.flashcard{min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.flashcard .front{font-family:var(--display);font-size:1.4rem;font-weight:600;line-height:1.25}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 4px;font-weight:700;font-size:.85rem}
.fix{border-left:3px solid var(--signal);padding-left:12px}
.fix .said{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.fix .try{font-weight:600}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.wk{position:relative;padding-bottom:18px}
.wk::before{content:"";position:absolute;left:-20px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.wk.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.wk.past::before{background:var(--good);border-color:var(--good)}
.scroll-x{overflow-x:auto}
.sep{height:1px;background:var(--line);margin:4px 0}
.center{text-align:center}
.loading{display:grid;place-items:center;min-height:70vh;gap:12px;text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kb summary{cursor:pointer;list-style:none;font-weight:700;font-family:var(--display);font-size:1.08rem}
.kb summary::-webkit-details-marker{display:none}
.kb[open] summary{margin-bottom:8px}
.tag{font-size:.75rem;font-weight:700;color:var(--accent)}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
table.cmp td,table.cmp th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.cmp th{font-weight:600;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion: reduce){.ring .pulse{transition:none}.spinner{animation-duration:3s}}
</style>
</head>
<body>
<div class="flashbar" id="flash"></div>
<div id="app"><div class="loading"><div class="spinner"></div><p class="muted">Loading your training data</p></div></div>
<nav class="nav" id="nav" hidden></nav>
<script>
/* ================= KNOWLEDGE BASE (research the app is built on) ================= */
const KB = [
 {id:'levelt', skill:'structure', title:'Why words go missing mid-sentence',
  finding:'Speaking runs through three stages: forming the idea, finding words and grammar for it, then saying it. When idea-planning and word-finding compete for the same limited working memory, both stall. Fillers mostly appear at the start of utterances, where planning load is highest.',
  use:'Lucid trains each stage separately so it becomes automatic: frameworks take over idea-planning, word drills speed up retrieval, and timed reps build flow. Once a stage runs on autopilot, the others get the headroom.',
  src:'Levelt (1989) model of speech production; Kosmala & Morgenstern (2019) on fillers occurring mainly in initial position with planning functions.'},
 {id:'fillers', skill:'fluency', title:'Fillers cost credibility, but only past a threshold',
  finding:'In a 2024 study, listeners rated speeches with fillers at 0, 2, 5 and 12 per minute. About 5 per minute did not hurt perceived effectiveness, while 12 per minute hurt it significantly, especially filler sounds like "um". Other work found filled pauses lower perceived readiness and certainty, and listeners were less likely to ask a disfluent speaker again.',
  use:'Your filler target starts from your own baseline and tightens each week, aiming for under 5 per minute, then under 2. Zero is not the goal; a few natural pauses read as thoughtful.',
  src:'Laske, DiGennaro Reed & Braren (2024), Journal of Applied Behavior Analysis; study of fillers in challenging conversational contexts on perceived readiness.'},
 {id:'awareness', skill:'fluency', title:'Awareness training is the fastest filler fix',
  finding:'Habit reversal training (noticing each filler as it happens, then substituting a silent pause) produced immediate drops in filled pauses for every participant in a 2016 study. A 2019 follow-up found awareness training alone was effective for all participants without booster sessions. Researchers typically target a 75 to 80% reduction from baseline.',
  use:'Week 1 has you tap a button every time you catch a filler, then compares your count to what Lucid detected. The live filler alarm flashes the screen edge the moment one slips out. The competing response you practise: close your lips, breathe, pause silently.',
  src:'Mancuso & Miltenberger (2016); Montes, Heinicke & Geierman (2019), Journal of Applied Behavior Analysis.'},
 {id:'retrieval', skill:'retrieval', title:'Effortful retrieval makes words easier to find',
  finding:'Pulling a word out of memory strengthens access to it far more than re-reading it. Longer, more effortful retrieval attempts predict better long-term retention, and training that pushes people to attempt retrieval before using a cue produces stronger gains. Spaced retrieval practice has been linked to longer fluent runs of speech and faster articulation.',
  use:'Word cards make you say the answer aloud before revealing it, and hold back the reveal for a few seconds so you actually try. Cards come back on an expanding schedule timed to just before you would forget them.',
  src:'Pyc & Rawson on retrieval effort; Gallée et al. (2020), Frontiers in Neurology; spaced retrieval case study in Frontiers in Education (2025).'},
 {id:'chunks', skill:'structure', title:'Ready-made phrases free up your brain',
  finding:'Fluent speakers store many multi-word phrases as single units and retrieve them whole. Across 269 speakers, these formulaic sequences significantly reduced pausing. In a controlled study, students trained to notice such phrases were rated more orally proficient by blind judges.',
  use:'Lucid builds you a bank of signposting phrases ("The short answer is", "Here is why that matters", "Take this example") and drills them until they come out automatically, so your working memory can focus on the idea.',
  src:'Yan (2020), TESOL Quarterly; Boers et al. (2006); Wray (2002), Formulaic Language and the Lexicon.'},
 {id:'432', skill:'fluency', title:'Repeating a talk under shrinking time builds automaticity',
  finding:'In the 4/3/2 technique you give the same talk three times with less time each round. Studies found hesitations dropped and speech rate rose by the final delivery, and later work reported gains that carried over to new topics over time. Repetition makes the same words and structures instantly available again.',
  use:'From week 4 you do a compressed 4/3/2 adapted for daily use: same topic, three rounds, each shorter. Lucid shows how your pace and fillers change across rounds.',
  src:'Nation (1989); Arevart & Nation (1991); De Jong & Perfetti (2011); Tran & Saito (2021).'},
 {id:'excited', skill:'composure', title:'Say "I am excited", not "calm down"',
  finding:'Most people believe calming down is the best way to handle nerves. But across studies involving public speaking, karaoke and maths, people who reappraised their anxiety as excitement felt more excited and performed better than those who tried to calm down. Saying "I am excited" out loud was enough.',
  use:'Every session opens with a 30-second reappraisal warm-up. Use the same line before real meetings and presentations.',
  src:'Brooks (2014), Journal of Experimental Psychology: General.'},
 {id:'exposure', skill:'composure', title:'Graded exposure shrinks speaking anxiety',
  finding:'Exposure therapy is among the best-supported treatments for public speaking anxiety. In self-guided exposure, people who gradually raised the difficulty of their speaking situations showed lower heart rate, lower anxiety and improvements that held a month later.',
  use:'Difficulty rises in small steps: less prep time, harder topics, then hostile questions. Daily real-world missions move the practice into your actual life.',
  src:'Meta-analysis of psychological interventions for fear of public speaking (PMC6428748); self-guided VR exposure study (PMC8416913).'},
 {id:'sleep', skill:'retrieval', title:'New words settle in while you sleep',
  finding:'A newly learned word is first stored as a separate memory, and only becomes integrated with your existing vocabulary after an offline consolidation period. Sleep plays a key role. A meta-analysis of 25 studies confirmed benefits of sleep for memory of new words.',
  use:'Lucid suggests doing your word review in the evening and training daily rather than cramming, so each night consolidates the day\u2019s work.',
  src:'Dumay & Gaskell (2007), Psychological Science; Schimke et al. (2021) meta-analysis, Psychonomic Bulletin & Review.'},
 {id:'pace', skill:'delivery', title:'Pace and pauses: the numbers that matter',
  finding:'Normal English speech runs roughly 150 to 180 words per minute; prepared presentations typically land between 120 and 150. Pauses often matter more for comprehension than overall speed, and speech with fewer, shorter hesitation pauses is judged more confident. Speech researchers treat silences of about half a second or more as noticeable pauses.',
  use:'Lucid measures your words per minute, your pauses of half a second or longer, and your mean length of run (words between pauses). The target band is about 130 to 170 words per minute, with deliberate pauses at the end of ideas, not mid-sentence.',
  src:'Griffiths (1990); Riggenbach (1991) pause thresholds; vocal confidence cue research (PMC12006449).'},
 {id:'deliberate', skill:'precision', title:'Improvement needs feedback on every rep',
  finding:'Skills improve fastest through deliberate practice: focused reps just beyond your current ability, with immediate specific feedback, repeated. Errorful practice where corrective feedback follows every attempt enhances retention.',
  use:'After each speaking drill, the coach quotes your exact words, shows a sharper version, and gives one instruction for the next rep. You then say the improved version aloud, which turns reading into production. The adaptive engine keeps each drill near an 80% success rate.',
  src:'Ericsson, Krampe & Tesch-R\u00f6mer (1993); Gall\u00e9e et al. (2020) on errorful, feedback-rich practice.'}
];

/* ================= REGIMEN PHASES ================= */
const PHASES = [
 {w:1, name:'Awareness', kb:['awareness','fillers','excited'], goal:'Catch every filler as it happens and replace it with a silent pause.', drills:'Filler awareness reps, word sprints, reappraisal warm-ups.'},
 {w:2, name:'Retrieval', kb:['retrieval','sleep'], goal:'Find precise words faster under time pressure.', drills:'Word sprints, banned-word speaking (no "thing", "stuff", "very"), spaced word cards.'},
 {w:3, name:'Structure', kb:['levelt','chunks'], goal:'Answer anything with a clear shape, using automatic signpost phrases.', drills:'Framework drills (PREP, What/So what/Now what, Problem/Solution/Benefit, STAR), phrase-bank drills.'},
 {w:4, name:'Flow under pressure', kb:['432','exposure'], goal:'Speak smoothly with little or no prep time.', drills:'4/3/2 repetition, zero-prep impromptu.'},
 {w:5, name:'Precision and concision', kb:['deliberate','levelt'], goal:'Say more with fewer, sharper words.', drills:'Compression ladder (60s, 30s, one sentence), mixed frameworks.'},
 {w:6, name:'Performance', kb:['pace','exposure'], goal:'Deliver talks and handle tough questions with control.', drills:'2-minute talks with pace targets, hostile Q&A.'}
];

/* ================= FRAMEWORKS & PHRASE BANK ================= */
const FRAMEWORKS = {
 PREP:{name:'PREP', steps:['Point','Reason','Example','Point again'], tip:'Say your conclusion in the first sentence. Then one reason, one concrete example, and restate the point.'},
 WSN:{name:'What / So what / Now what', steps:['What','So what','Now what'], tip:'What happened or what is true, why it matters, and what should happen next.'},
 PSB:{name:'Problem / Solution / Benefit', steps:['Problem','Solution','Benefit'], tip:'Name the pain, give your fix, then paint the result. Built for persuasion.'},
 STAR:{name:'STAR', steps:['Situation','Task','Action','Result'], tip:'For stories and interview answers. Spend most of your time on Action and Result.'},
 PPF:{name:'Past / Present / Future', steps:['Past','Present','Future'], tip:'How it was, how it is now, where it is heading. Great for updates.'},
 THREE:{name:'Rule of three', steps:['Headline','One','Two','Three','Close'], tip:'Announce three points up front, deliver them in order, close with the headline.'}
};
const CHUNKS = {
 opening:['The short answer is','Here is how I see it','The key point is','Let me start with the big picture'],
 reason:['The reason is','What that means is','This matters because','The main driver is'],
 example:['Take this example','A good example is','To make that concrete','Picture this'],
 contrast:['That said','On the other hand','The catch is','Where it gets interesting is'],
 close:['So the bottom line is','Which is why','If you remember one thing','That is why I would'],
 pause:['Let me think about that for a second','Good question, here is my take','Let me put it another way']
};

/* ================= TOPIC BANK (tiers 1-4) ================= */
const TOPICS = {
 general:{
  1:['Describe your ideal weekend in detail.','Explain how to make your favourite meal.','Describe the place you grew up.','Talk about a skill you have that most people do not.','Describe a book, film or show that stuck with you, and why.','Explain your daily routine and what you would change about it.','Describe the best trip you have taken.','Talk about a person who shaped how you think.'],
  2:['Is it better to be a specialist or a generalist?','Should people work from home or the office?','What makes a good friend?','Is social media doing more harm than good?','What habit has improved your life the most?','Should schools teach personal finance?','What is overrated and why?','Is ambition always a good thing?'],
  3:['Convince me that failure is necessary for success.','Argue for a four-day work week.','What will people 50 years from now think we got badly wrong?','Make the case for learning something useless.','Explain why trust is harder to rebuild than to build.','Argue that boredom is valuable.','Persuade me to change one belief I probably hold.','What is the most important problem of your generation, and what should be done?'],
  4:['You have 60 seconds to convince a sceptical stranger to fund your idea.','Someone says your generation is lazy. Respond.','Defend an unpopular opinion you actually hold.','Explain why you disagree with a common piece of advice.','Argue the opposite of what you believe about remote work.','Give a toast at a friend\u2019s wedding, with no warning.']
 },
 work:{
  1:['Explain what you do at work to a smart 12-year-old.','Walk me through a normal week in your job.','Describe a tool or process your team relies on.'],
  2:['What would you change about how meetings run at your workplace?','What makes a great manager?','Give a status update on a project you know well.'],
  3:['Pitch a change to your team\u2019s process that would save time.','Argue for or against a decision your company made recently.','Explain a complex problem at work so a new hire gets it.'],
  4:['Your project is two weeks late. Explain why to leadership and what happens next.','A colleague challenges your numbers in a meeting. Respond.','Make the case for a budget increase in under a minute.']
 },
 interview:{
  1:['Tell me about yourself.','Why are you interested in this field?','What are you most proud of?'],
  2:['Tell me about a time you solved a hard problem.','What is your biggest weakness?','Describe a time you worked with a difficult person.'],
  3:['Tell me about a time you failed and what you learned.','Why should we hire you over other candidates?','Where do you see yourself in five years, and why?'],
  4:['Your CV has a gap. Explain it.','Convince me you can handle a role you have not done before.','What would your harshest critic say about you?']
 },
 presentation:{
  1:['Introduce yourself to a room of 50 people.','Present a hobby of yours as if teaching a class.'],
  2:['Present the case for one simple change that improves productivity.','Give a 1-minute summary of a topic you know well.'],
  3:['Open a talk on why listening is the most underrated skill.','Present a trend you think most people are ignoring.'],
  4:['Close a pitch with a call to action that gets a yes.','Recover after losing your place in a presentation, then continue.']
 },
 social:{
  1:['Tell a story about something funny that happened to you.','Describe your perfect evening with friends.'],
  2:['Explain a hobby so someone else wants to try it.','Recommend a restaurant and make me want to go.'],
  3:['Tell a story that has a surprising ending.','Share an opinion at a dinner party that might start a debate.'],
  4:['You are asked to say a few words at a gathering. Go.','Someone disagrees with you loudly at dinner. Respond calmly.']
 }
};
const HOSTILE = {

          silentMs=0; voiced=true; audio.lastVoiceMs = now-t0;
        } else if(started){ silentMs+=dt; }
      }, 50);
    }).catch(()=>{});
  }
  return {
    text,
    async stop(){
      active=false; if(rec){ try{ rec.stop(); }catch(e){} }
      await new Promise(r=>setTimeout(r, 700));
      if(timer) clearInterval(timer); if(stream) stream.getTracks().forEach(t=>t.stop()); if(ctx) try{ ctx.close(); }catch(e){}
      const hasAudio = audio.firstVoiceMs!=null;
      if(hasAudio) audio.speakMs = (audio.lastVoiceMs||0) - audio.firstVoiceMs;
      return { text:text(), audio: hasAudio ? audio : null };
    }
  };
}

/* ================= ADAPTIVE ENGINE ================= */
function currentWeek(dayNum){ return Math.min(7, Math.floor((dayNum-1)/7)+1); }
function fillerTarget(week){ const b = S.baseline ? S.baseline.fpm : 6; return round(Math.max(1.5, Math.min(5, b*(1-0.13*week))),1); }
function lvl(key){ return S.levels[key] || 1; }
function prepFor(key, week){ const l=lvl(key); const base = Math.max(0, 35 - l*4); return week>=4 ? Math.min(base, 10) : Math.max(base, 8); }
function speakFor(key){ const l=lvl(key); return Math.min(150, 45 + l*8); }
function tierFor(key, week){ return Math.min(4, Math.max(1, Math.ceil(lvl(key)/3), week>=6?3:week>=4?2:1)); }
function topicFor(key, week, r){
  const ctxs = ['general', ...(S.profile.contexts||[])];
  const tier = tierFor(key, week);
  const ctx = pick(ctxs, r); const pool = (TOPICS[ctx]||TOPICS.general)[tier] || TOPICS.general[tier];
  return pick(pool, r);
}
function weakestSkill(){ let min=null,k=null; for(const s in S.skills){ if(min==null || S.skills[s]<min){ min=S.skills[s]; k=s; } } return k||'fluency'; }
function updateSkill(k, obs){ if(obs==null || isNaN(obs) || !S.skills) return; S.skills[k] = Math.round(S.skills[k]*0.75 + obs*0.25); }
const MARKERS = ['first','second','third','finally','because','for example','for instance','which means','that is why','in short','the key','the point is','on the other hand','however','to sum up','bottom line','overall','the reason','so the','in other words', ...Object.values(CHUNKS).flat().map(x=>x.toLowerCase())];
function structureHeuristic(text){ const n=words(text).length; if(n<20) return null; const c=countPhrases(text, MARKERS).count; return clamp(25 + c/n*100*16); }
function applyObservations(m, coach, text){
  const s = m.sub;
  updateSkill('fluency', s.fluency); updateSkill('retrieval', s.lexical);
  updateSkill('precision', avg([s.vague, coach?.scores?.precision*10]));
  updateSkill('delivery', avg([s.rate, s.pause])); updateSkill('composure', s.hedge);
  if(coach?.scores){ updateSkill('structure', avg([coach.scores.structure*10, coach.scores.coherence!=null?coach.scores.coherence*10:null])); updateSkill('concision', coach.scores.concision*10); }
  else { updateSkill('concision', m.sub.concisionH); if(text) updateSkill('structure', avg([structureHeuristic(text), m.sub.clarityH])); }
}
function staircase(key, success, fail){ const l=lvl(key); if(success) S.levels[key]=Math.min(10,l+1); else if(fail) S.levels[key]=Math.max(1,l-1); }

 words:{icon:'\uD83E\uDDE0', title:'Word cards', sub:'Effortful retrieval, spaced review'},

};
const SKILL_DRILL = {fluency:'awareness', retrieval:'sprint', structure:'framework', precision:'precision', concision:'compress', delivery:'talk', composure:'qa'};
const PHASE_DRILLS = {1:['awareness','sprint','awareness'],2:['sprint','precision','impromptu'],3:['framework','chunks','framework'],4:['f432','impromptu','chunks'],5:['compress','framework','precision'],6:['qa','talk','compress'],7:['talk','qa','f432','compress','framework']};

function buildPlan(dayNum){
  const r = rng(todayStr()+':'+dayNum); const week = currentWeek(dayNum);
  const items = [{type:'warmup'}];
  if(dayNum>1 && dayNum%7===1){ items.push({type:'checkpoint'}); return {dayNum, week, items, mission:pick(MISSIONS[Math.min(6,week)], r), tip:tipFor(r)}; }
  items.push({type:'words'});
  const nDrills = S.profile.minutes>=20 ? 4 : S.profile.minutes>=15 ? 3 : 2;
  let pool = PHASE_DRILLS[week].slice();
  if(week===7){ pool = pool.sort(()=>r()-0.5); }
  const chosen = [];
  for(const d of pool){ if(chosen.length<nDrills-1) chosen.push(d); }
  const weak = SKILL_DRILL[weakestSkill()];
  if(!chosen.includes(weak) || chosen.length<nDrills) chosen.push(weak);
  while(chosen.length<nDrills) chosen.push(pool[chosen.length%pool.length]);
  const seen={}; for(const t of chosen.slice(0,nDrills)){ seen[t]=(seen[t]||0)+1; items.push(makeDrill(t, week, r, seen[t]-1)); }
  return {dayNum, week, items, mission:pick(MISSIONS[Math.min(6,week)], r), tip:tipFor(r)};
}
function tipFor(r){ const k=weakestSkill(); return {skill:k, text:pick(TIPS[k], r)}; }
function makeDrill(type, week, r, variant=0){
  const fwKeys = (S.profile.contexts||[]).includes('interview') ? ['PREP','WSN','PSB','STAR','PPF','THREE'] : ['PREP','WSN','PSB','PPF','THREE','STAR'];
  const d = {type};
  const ctx = pick(['general',...(S.profile.contexts||[])], r);
  switch(type){
    case 'awareness': d.topic = topicFor(type, week, r); d.prep=prepFor(type,week); d.sec=speakFor(type); d.tap=true; break;
    case 'sprint': d.topic = pick(SPRINTS, r); d.sec=45; d.target = 7 + lvl('sprint'); break;
    case 'precision': d.topic = topicFor(type, week, r); d.prep=prepFor(type,week); d.sec=speakFor(type); d.banned=true; break;
    case 'framework': { const fw = fwKeys[(S.completed + variant*3) % fwKeys.length]; d.fw=fw; d.topic = fw==='STAR' ? pick(TOPICS.interview[Math.min(3,tierFor(type,week))], r) : topicFor(type, week, r); d.prep=prepFor(type,week); d.sec=speakFor(type); break; }
    case 'chunks': { const cats=Object.keys(CHUNKS).filter(c=>c!=='pause'); const sel=[]; const rr=cats.sort(()=>r()-0.5).slice(0,3); for(const c of rr) sel.push(pick(CHUNKS[c], r)); d.chunks=sel; d.topic=topicFor(type,week,r); d.prep=prepFor(type,week); d.sec=Math.max(60,speakFor(type)); break; }
    case 'f432': d.topic = topicFor(type, week, r); d.prep=20; const b = 60 + lvl(type)*6; d.rounds=[b, Math.round(b*0.75), Math.round(b*0.5)]; break;
    case 'impromptu': d.topic = topicFor(type, Math.max(week,4), r); d.prep=Math.max(0, 6 - lvl(type)); d.sec=speakFor(type); break;
    case 'compress': d.topic = topicFor(type, week, r); d.prep=prepFor(type,week); d.rounds=[60,30,15]; break;
    case 'qa': d.topic = pick(HOSTILE[ctx]||HOSTILE.general, r); d.prep=Math.max(3, 12-lvl(type)); d.sec=Math.min(75, 40+lvl(type)*4); break;
    case 'talk': d.topic = topicFor(type, Math.max(week,3), r); d.fw='THREE'; d.prep=Math.max(20, 60-lvl(type)*5); d.sec=Math.min(180, 100+lvl(type)*8); break;
  }
  return d;
}
function todayRec(){
  const t = todayStr();
  if(!S.days[t]){
    const dn = S.completed + 1;
    S.days[t] = {plan: buildPlan(dn), done:[], complete:false};
    save();
  }
  return S.days[t];
}
function liveStreak(){ return (S.lastDone===todayStr()||S.lastDone===addDays(todayStr(),-1)) ? S.streak : 0; }
function dueCards(){ const t=todayStr(); return S.cards.filter(c=>c.due<=t); }
function addCard(front, back, src='seed'){ if(S.cards.some(c=>c.front===front)) return; S.cards.push({id:Math.random().toString(36).slice(2,9), front, back, src, ease:2.5, ivl:0, due:todayStr(), reps:0}); }
function gradeCard(c, g){
  if(g===0){ c.ivl=0; c.reps=0; c.ease=Math.max(1.3,c.ease-0.2); c.due=todayStr(); return; }
  c.reps++;
  if(g===1){ c.ivl = Math.max(1, Math.round((c.ivl||1)*1.2)); c.ease=Math.max(1.3,c.ease-0.15); }
  else if(g===2){ c.ivl = c.reps===1 ? 1 : c.reps===2 ? 3 : Math.round(c.ivl*c.ease); }
  else { c.ivl = c.reps===1 ? 3 : Math.round((c.ivl||1)*c.ease*1.3); c.ease+=0.15; }
  c.due = addDays(todayStr(), c.ivl);
}

async function askJSON(prompt){
  if(SAMPLE) return await SAMPLE.json(prompt, {signal: coachCtl.signal, modelTier:'default'});
  if(!S.settings.apiKey) throw {code:'unavailable'};
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal: coachCtl.signal,
      headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model: S.settings.model || 'claude-sonnet-5', max_tokens: 1500, messages:[{role:'user', content: prompt}]})});
  }catch(e){ if(e && e.name==='AbortError') throw {code:'cancelled'}; throw {code:'network'}; }
  if(res.status===401 || res.status===403) throw {code:'bad_key'};
  if(res.status===429) throw {code:'rate_limited'};
  if(!res.ok) throw {code:'api_error', status:res.status};
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  try{ return JSON.parse(clean); }catch(e){}
  const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
  if(a>=0 && b>a){ try{ return JSON.parse(clean.slice(a,b+1)); }catch(e){} }
  throw {code:'invalid_json'};
}

function assessRounds(seed){
  const r=rng('assess'+seed); const ctx=pick(['general',...(S.profile.contexts||[])], r);
  return [
    {label:'Task 1 of 3: Impromptu opinion', topic: pick((TOPICS[ctx]||TOPICS.general)[2], r), prep:20, sec:60, mode:'speak'},
    {label:'Task 2 of 3: Word sprint', topic: pick(SPRINTS, r), prep:0, sec:45, mode:'sprint'},
    {label:'Task 3 of 3: Explain it simply', topic:'Explain how something you know well works (your job, a hobby, a game, a process) to a smart 12-year-old.', prep:15, sec:60, mode:'speak'}
  ];
}
function roundsFor(it){
  switch(it.type){
    case 'sprint': return [{topic:it.topic, prep:0, sec:it.sec, mode:'sprint'}];
    case 'f432': return it.rounds.map((s,i)=>({topic:it.topic, prep:i?0:it.prep, sec:s, mode:'speak', instruction:['Round 1: say it fully, with every key point.','Round 2: the same content in 25% less time. Keep every key point.','Round 3: the same content in half the original time. Faster, not sloppier.'][i]}));
    case 'compress': return [[60,'Explain it fully.'],[30,'Same ideas, half the time. Cut the warm-up and lead with the point.'],[15,'One sentence. The essence only.']].map(([s,ins],i)=>({topic:it.topic, prep:i?0:it.prep, sec:s, mode:'speak', instruction:ins}));
    default: return [{topic:it.topic, prep:it.prep, sec:it.sec, mode:'speak'}];
  }
}
function startRun(i){
  const rec=todayRec(); const it=rec.plan.items[i];
  stopRunTimers();

  else if(it.type==='words'){ let q=dueCards().slice(0,12).map(c=>c.id); let extra=false; if(!q.length){ q=S.cards.slice().sort(()=>Math.random()-0.5).slice(0,5).map(c=>c.id); extra=true; } RUN={kind:'words', idx:i, item:it, q, pos:0, revealed:false, lockUntil:Date.now()+4000, again:{}, graded:0, extra}; }
  else if(it.type==='checkpoint') RUN={kind:'check', idx:i, item:{type:'checkpoint'}, rounds:assessRounds(todayStr()), r:0, phase:'intro', results:[], taps:0};
  else RUN={kind:'drill', idx:i, item:it, rounds:roundsFor(it), r:0, phase:'intro', results:[], taps:0};
  view='run'; render(); window.scrollTo(0,0);
}
function startAssess(){ stopRunTimers(); RUN={kind:'assess', idx:-1, item:{type:'assess'}, rounds:assessRounds(Date.now()), r:0, phase:'intro', results:[], taps:0}; view='run'; render(); window.scrollTo(0,0); }

  warmnext(){ if(RUN.step<2){ RUN.step++; render(); } else { A.done(); } },
  reveal(){ if(Date.now()<RUN.lockUntil) return; RUN.revealed=true; render(); },
  grade(v){ const c=S.cards.find(x=>x.id===RUN.q[RUN.pos]); const g=+v; if(c){ gradeCard(c,g); RUN.graded++; if(g===0 && !RUN.again[c.id]){ RUN.again[c.id]=1; RUN.q.push(c.id); } updateSkill('retrieval', g===0?30:g===1?55:g===2?75:90); save(); } RUN.pos++; RUN.revealed=false; RUN.lockUntil=Date.now()+4000; render(); },
  ptab(v){ progTab=v; render(); },
  savekey(){ S.settings.apiKey=$('#apikey').value.trim(); S.settings.model=$('#apimodel').value.trim()||'claude-sonnet-5'; save(); const m=$('#keymsg'); if(m) m.textContent=S.settings.apiKey?'Saved. Coach is on.':'Key removed. Coach is off.'; },
  async testkey(){ A.savekey(); const m=$('#keymsg'); if(!S.settings.apiKey){ return; } m.textContent='Testing\u2026'; coachCtl=new AbortController(); try{ const r=await askJSON('Reply with only this JSON: {"ok":true}'); m.textContent = r&&r.ok ? 'Connected. Coach is on.' : 'Connected, but the reply was unexpected.'; }catch(e){ m.textContent = e.code==='bad_key'?'That key was rejected.': e.code==='network'?'Could not reach the API. Check your connection.': e.code==='api_error'?`The API returned an error (${e.status}). Check the model name.`:'Test failed: '+(e.code||'unknown'); } },
  async export(){ const blob=new Blob([JSON.stringify({...S, settings:{...S.settings, apiKey:''}})],{type:'application/json'}); const name='lucid-backup-'+todayStr()+'.json'; const msg=$('#bkmsg');
    try{ const f=new File([blob],name,{type:'application/json'}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:'Lucid backup'}); if(msg) msg.textContent='Backup shared. Save it to Files or iCloud Drive.'; return; } }catch(e){ if(e && e.name==='AbortError') return; }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); if(msg) msg.textContent='Backup downloaded.'; },
  import(){ const f=$('#importfile'); if(f) f.click(); },
  toggle(k){ S.settings[k]=!S.settings[k]; save(); render(); },
  input(v){ S.settings.input=v; save(); render(); },
  setmin(v){ S.profile.minutes=+v; save(); render(); },
  setctx(v){ const c=S.profile.contexts; S.profile.contexts = c.includes(v)?c.filter(x=>x!==v):[...c,v]; save(); render(); },
  reset(){ confirmReset=true; render(); },
  resetcancel(){ confirmReset=false; render(); },
  retake(){ S.baseline=null; S.baseSkills=null; S.skills=null; S.levels={}; S.history=[]; S.checkpoints=[]; S.days={}; S.completed=0; S.streak=0; S.lastDone=null; S.doneDates=[]; save(); view='today'; render(); window.scrollTo(0,0); },
  resetconfirm(){ const keep=S.settings; S=freshState(); S.settings=keep; confirmReset=false; OB={name:'', contexts:['work'], minutes:15, anxiety:5, goal:''}; save(); view='onboard'; render(); window.scrollTo(0,0); }
};
document.addEventListener('click', e=>{ const el=e.target.closest('[data-a]'); if(!el || el.disabled) return; const f=A[el.dataset.a]; if(f){ e.preventDefault(); f(el.dataset.v, el); } });
document.addEventListener('change', async e=>{ if(e.target.id!=='importfile') return; const file=e.target.files[0]; if(!file) return; const msg=$('#bkmsg');
  try{ const data=JSON.parse(await file.text()); if(!data || !data.v || !data.profile) throw 0; const key=S.settings.apiKey, model=S.settings.model; S=Object.assign(freshState(), data); S.settings=Object.assign(freshState().settings, data.settings||{}, {apiKey:key, model}); save(); view='today'; render(); window.scrollTo(0,0); }
  catch(err){ if(msg) msg.textContent='That file isn\u2019t a Lucid backup.'; } });
document.addEventListener('input', e=>{ if(e.target.id==='obAnx'){ OB.anxiety=+e.target.value; const v=$('#obAnxV'); if(v) v.textContent=OB.anxiety+'/10'; } });

/* ================= INIT ================= */
(async function init(){
  let loaded=null; try{ loaded = await loadState(); }catch(e){}
  S = loaded && loaded.v ? Object.assign(freshState(), loaded) : freshState();
  S.settings = Object.assign(freshState().settings, S.settings||{});
  if(S.profile && !S.profile.contexts) S.profile.contexts=[];
  view = S.profile ? 'today' : 'onboard';
  render();
  if(store.mode!=='cloud' && navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
  if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
</body>
