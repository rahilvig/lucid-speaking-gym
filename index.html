<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucid: speaking gym</title>
<meta name="theme-color" content="#3D2BF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lucid">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEF4; --surface:#FFFFFF; --surface2:#F5F6FA; --ink:#151A3A; --muted:#5B6180; --line:#D9DCE8;
  --accent:#3D2BF5; --accent-ink:#FFFFFF; --accent-soft:#E6E3FF; --signal:#FFB020; --signal-soft:#FFF1D6;
  --good:#0F8F6A; --good-soft:#DDF3EB; --bad:#D93F45; --bad-soft:#FBE2E3;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1126; --surface:#181C3A; --surface2:#1F2447; --ink:#E9EBF8; --muted:#9AA0C3; --line:#2C3263;
    --accent:#8577FF; --accent-ink:#0E1126; --accent-soft:#2A2760; --signal:#FFB84D; --signal-soft:#3A2E17;
    --good:#3DD6A3; --good-soft:#123A30; --bad:#FF6B70; --bad-soft:#3E1C24; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1126; --surface:#181C3A; --surface2:#1F2447; --ink:#E9EBF8; --muted:#9AA0C3; --line:#2C3263;
  --accent:#8577FF; --accent-ink:#0E1126; --accent-soft:#2A2760; --signal:#FFB84D; --signal-soft:#3A2E17;
  --good:#3DD6A3; --good-soft:#123A30; --bad:#FF6B70; --bad-soft:#3E1C24; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-0.02em}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-0.03em;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;border:1px solid var(--line)}
.card.flat{background:var(--surface2);border:none}
.card.hero{background:var(--accent);color:var(--accent-ink);border:none}
.card.hero .muted{color:inherit;opacity:.8}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:14px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--ink)}
.btn.warn{background:var(--signal);color:#1b1400}
.btn.inv{background:var(--accent-ink);color:var(--accent)}
.btn:disabled{opacity:.45}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,.item:focus-visible,.navb:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--accent-soft);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.sig{background:var(--signal-soft);color:var(--ink)}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:1.25rem;flex:none}
.item.done{opacity:.6}
.item.done .ic{background:var(--good-soft)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.nav[hidden]{display:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.navb{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted);padding:4px 12px;border-radius:12px}
.navb .g{font-size:1.25rem}
.navb.on{color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:var(--surface2);border-radius:var(--r-md);padding:12px}
.metric .v{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.metric .l{font-size:.8rem;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bignum{font-family:var(--display);font-weight:800;font-size:4.2rem;line-height:1;letter-spacing:-0.04em}
.stage{min-height:calc(100vh - 60px);display:flex;flex-direction:column;gap:16px}
.topicbox{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.2}
.ringwrap{display:grid;place-items:center;padding:8px 0}
.ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;background:var(--surface);border:1px solid var(--line)}
.ring .pulse{position:absolute;inset:0;border-radius:50%;border:6px solid var(--accent);transform:scale(1);transition:transform .08s linear, border-color .15s}
.ring.flash .pulse{border-color:var(--signal)}
.ring .time{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:-0.04em}
.ring .sub{font-size:.8rem;color:var(--muted);text-align:center}
.live{background:var(--surface2);border-radius:var(--r-md);padding:12px;min-height:84px;max-height:170px;overflow:auto;font-size:.95rem}
.live mark{background:var(--signal-soft);color:var(--ink);border-radius:4px;padding:0 2px}
.live mark.ban{background:var(--bad-soft)}
.flashbar{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 var(--signal);transition:box-shadow .12s;z-index:30}
.flashbar.on{box-shadow:inset 0 0 0 10px var(--signal)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.85rem;font-weight:600}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px}
textarea{min-height:140px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.flashcard{min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center}
.flashcard .front{font-family:var(--display);font-size:1.4rem;font-weight:600;line-height:1.25}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 4px;font-weight:700;font-size:.85rem}
.fix{border-left:3px solid var(--signal);padding-left:12px}
.fix .said{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--bad)}
.fix .try{font-weight:600}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.wk{position:relative;padding-bottom:18px}
.wk::before{content:"";position:absolute;left:-20px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.wk.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.wk.past::before{background:var(--good);border-color:var(--good)}
.scroll-x{overflow-x:auto}
.sep{height:1px;background:var(--line);margin:4px 0}
.center{text-align:center}
.loading{display:grid;place-items:center;min-height:70vh;gap:12px;text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.kb summary{cursor:pointer;list-style:none;font-weight:700;font-family:var(--display);font-size:1.08rem}
.kb summary::-webkit-details-marker{display:none}
.kb[open] summary{margin-bottom:8px}
.tag{font-size:.75rem;font-weight:700;color:var(--accent)}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
table.cmp td,table.cmp th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.cmp th{font-weight:600;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion: reduce){.ring .pulse{transition:none}.spinner{animation-duration:3s}}
</style>
</head>
<body>
<div class="flashbar" id="flash"></div>
<div id="app"><div class="loading"><div class="spinner"></div><p class="muted">Loading your training data</p></div></div>
<nav class="nav" id="nav" hidden></nav>
<script>
/* ================= KNOWLEDGE BASE (research the app is built on) ================= */
const KB = [
 {id:'levelt', skill:'structure', title:'Why words go missing mid-sentence',
  finding:'Speaking runs through three stages: forming the idea, finding words and grammar for it, then saying it. When idea-planning and word-finding compete for the same limited working memory, both stall. Fillers mostly appear at the start of utterances, where planning load is highest.',
  use:'Lucid trains each stage separately so it becomes automatic: frameworks take over idea-planning, word drills speed up retrieval, and timed reps build flow. Once a stage runs on autopilot, the others get the headroom.',
  src:'Levelt (1989) model of speech production; Kosmala & Morgenstern (2019) on fillers occurring mainly in initial position with planning functions.'},
 {id:'fillers', skill:'fluency', title:'Fillers cost credibility, but only past a threshold',
  finding:'In a 2024 study, listeners rated speeches with fillers at 0, 2, 5 and 12 per minute. About 5 per minute did not hurt perceived effectiveness, while 12 per minute hurt it significantly, especially filler sounds like "um". Other work found filled pauses lower perceived readiness and certainty, and listeners were less likely to ask a disfluent speaker again.',
  use:'Your filler target starts from your own baseline and tightens each week, aiming for under 5 per minute, then under 2. Zero is not the goal; a few natural pauses read as thoughtful.',
  src:'Laske, DiGennaro Reed & Braren (2024), Journal of Applied Behavior Analysis; study of fillers in challenging conversational contexts on perceived readiness.'},
 {id:'awareness', skill:'fluency', title:'Awareness training is the fastest filler fix',
  finding:'Habit reversal training (noticing each filler as it happens, then substituting a silent pause) produced immediate drops in filled pauses for every participant in a 2016 study. A 2019 follow-up found awareness training alone was effective for all participants without booster sessions. Researchers typically target a 75 to 80% reduction from baseline.',
  use:'Week 1 has you tap a button every time you catch a filler, then compares your count to what Lucid detected. The live filler alarm flashes the screen edge the moment one slips out. The competing response you practise: close your lips, breathe, pause silently.',
  src:'Mancuso & Miltenberger (2016); Montes, Heinicke & Geierman (2019), Journal of Applied Behavior Analysis.'},
 {id:'retrieval', skill:'retrieval', title:'Effortful retrieval makes words easier to find',
  finding:'Pulling a word out of memory strengthens access to it far more than re-reading it. Longer, more effortful retrieval attempts predict better long-term retention, and training that pushes people to attempt retrieval before using a cue produces stronger gains. Spaced retrieval practice has been linked to longer fluent runs of speech and faster articulation.',
  use:'Word cards make you say the answer aloud before revealing it, and hold back the reveal for a few seconds so you actually try. Cards come back on an expanding schedule timed to just before you would forget them.',
  src:'Pyc & Rawson on retrieval effort; Gallée et al. (2020), Frontiers in Neurology; spaced retrieval case study in Frontiers in Education (2025).'},
 {id:'chunks', skill:'structure', title:'Ready-made phrases free up your brain',
  finding:'Fluent speakers store many multi-word phrases as single units and retrieve them whole. Across 269 speakers, these formulaic sequences significantly reduced pausing. In a controlled study, students trained to notice such phrases were rated more orally proficient by blind judges.',
  use:'Lucid builds you a bank of signposting phrases ("The short answer is", "Here is why that matters", "Take this example") and drills them until they come out automatically, so your working memory can focus on the idea. Daily phrase cards extend this to collocations: which words naturally go together, like “strike a balance” or “raise a concern”.',
  src:'Yan (2020), TESOL Quarterly; Boers et al. (2006); Wray (2002), Formulaic Language and the Lexicon.'},
 {id:'432', skill:'fluency', title:'Repeating a talk under shrinking time builds automaticity',
  finding:'In the 4/3/2 technique you give the same talk three times with less time each round. Studies found hesitations dropped and speech rate rose by the final delivery, and later work reported gains that carried over to new topics over time. Repetition makes the same words and structures instantly available again.',
  use:'From week 4 you do a compressed 4/3/2 adapted for daily use: same topic, three rounds, each shorter. Lucid shows how your pace and fillers change across rounds.',
  src:'Nation (1989); Arevart & Nation (1991); De Jong & Perfetti (2011); Tran & Saito (2021).'},
 {id:'excited', skill:'composure', title:'Say "I am excited", not "calm down"',
  finding:'Most people believe calming down is the best way to handle nerves. But across studies involving public speaking, karaoke and maths, people who reappraised their anxiety as excitement felt more excited and performed better than those who tried to calm down. Saying "I am excited" out loud was enough.',
  use:'Every session opens with a 30-second reappraisal warm-up. Use the same line before real meetings and presentations.',
  src:'Brooks (2014), Journal of Experimental Psychology: General.'},
 {id:'exposure', skill:'composure', title:'Graded exposure shrinks speaking anxiety',
  finding:'Exposure therapy is among the best-supported treatments for public speaking anxiety. In self-guided exposure, people who gradually raised the difficulty of their speaking situations showed lower heart rate, lower anxiety and improvements that held a month later.',
  use:'Difficulty rises in small steps: less prep time, harder topics, then hostile questions. Daily real-world missions move the practice into your actual life.',
  src:'Meta-analysis of psychological interventions for fear of public speaking (PMC6428748); self-guided VR exposure study (PMC8416913).'},
 {id:'sleep', skill:'retrieval', title:'New words settle in while you sleep',
  finding:'A newly learned word is first stored as a separate memory, and only becomes integrated with your existing vocabulary after an offline consolidation period. Sleep plays a key role. A meta-analysis of 25 studies confirmed benefits of sleep for memory of new words.',
  use:'Lucid suggests doing your word review in the evening and training daily rather than cramming, so each night consolidates the day\u2019s work.',
  src:'Dumay & Gaskell (2007), Psychological Science; Schimke et al. (2021) meta-analysis, Psychonomic Bulletin & Review.'},
 {id:'pace', skill:'delivery', title:'Pace and pauses: the numbers that matter',
  finding:'Normal English speech runs roughly 150 to 180 words per minute; prepared presentations typically land between 120 and 150. Pauses often matter more for comprehension than overall speed, and speech with fewer, shorter hesitation pauses is judged more confident. Speech researchers treat silences of about half a second or more as noticeable pauses.',
  use:'Lucid measures your words per minute, your pauses of half a second or longer, and your mean length of run (words between pauses). The target band is about 130 to 170 words per minute, with deliberate pauses at the end of ideas, not mid-sentence.',
  src:'Griffiths (1990); Riggenbach (1991) pause thresholds; vocal confidence cue research (PMC12006449).'},
 {id:'questions', skill:'curiosity', title:'Follow-up questions make people like you',
  finding:'Across three studies of live conversations, people who asked more questions, especially follow-up questions, were better liked, and speed daters who asked more follow-ups got more second dates. The effect works because questions invite the other person to share about themselves, which they enjoy. Separately, strangers who were asked to skip small talk found deep conversations less awkward and more connecting than they expected. People underestimate how much others want to go deeper. One caution: questions that steer back to yourself undermine rapport.',
  use:'The Deeper questions drill puts you in a short role-played conversation. You ask three questions in a row, and the other person answers more openly when your questions are open, build on what they just said, and move up the ladder from facts to experience, feelings and meaning. Each question is scored on those four things, with a better alternative shown.',
  src:'Huang, Yeomans, Brooks, Minson & Gino (2017), Journal of Personality and Social Psychology; Kardas, Kumar & Epley (2022), Journal of Personality and Social Psychology.'},
 {id:'deliberate', skill:'precision', title:'Improvement needs feedback on every rep',
  finding:'Skills improve fastest through deliberate practice: focused reps just beyond your current ability, with immediate specific feedback, repeated. Errorful practice where corrective feedback follows every attempt enhances retention.',
  use:'After each speaking drill, the coach quotes your exact words, shows a sharper version, and gives one instruction for the next rep. You then say the improved version aloud, which turns reading into production. The adaptive engine keeps each drill near an 80% success rate.',
  src:'Ericsson, Krampe & Tesch-R\u00f6mer (1993); Gall\u00e9e et al. (2020) on errorful, feedback-rich practice.'}
];

/* ================= REGIMEN PHASES ================= */
const PHASES = [
 {w:1, name:'Awareness', kb:['awareness','fillers','excited'], goal:'Catch every filler as it happens and replace it with a silent pause.', drills:'Filler awareness reps, word sprints, reappraisal warm-ups.'},
 {w:2, name:'Retrieval', kb:['retrieval','sleep'], goal:'Find precise words faster under time pressure.', drills:'Word sprints, banned-word speaking (no "thing", "stuff", "very"), spaced word cards.'},
 {w:3, name:'Structure', kb:['levelt','chunks'], goal:'Answer anything with a clear shape, using automatic signpost phrases.', drills:'Framework drills (PREP, What/So what/Now what, Problem/Solution/Benefit, STAR), phrase-bank drills.'},
 {w:4, name:'Flow under pressure', kb:['432','exposure'], goal:'Speak smoothly with little or no prep time.', drills:'4/3/2 repetition, zero-prep impromptu.'},
 {w:5, name:'Precision and concision', kb:['deliberate','levelt'], goal:'Say more with fewer, sharper words.', drills:'Compression ladder (60s, 30s, one sentence), mixed frameworks.'},
 {w:6, name:'Performance', kb:['pace','exposure'], goal:'Deliver talks and handle tough questions with control.', drills:'2-minute talks with pace targets, hostile Q&A.'}
];

/* ================= FRAMEWORKS & PHRASE BANK ================= */
const FRAMEWORKS = {
 PREP:{name:'PREP', steps:['Point','Reason','Example','Point again'], tip:'Say your conclusion in the first sentence. Then one reason, one concrete example, and restate the point.'},
 WSN:{name:'What / So what / Now what', steps:['What','So what','Now what'], tip:'What happened or what is true, why it matters, and what should happen next.'},
 PSB:{name:'Problem / Solution / Benefit', steps:['Problem','Solution','Benefit'], tip:'Name the pain, give your fix, then paint the result. Built for persuasion.'},
 STAR:{name:'STAR', steps:['Situation','Task','Action','Result'], tip:'For stories and interview answers. Spend most of your time on Action and Result.'},
 PPF:{name:'Past / Present / Future', steps:['Past','Present','Future'], tip:'How it was, how it is now, where it is heading. Great for updates.'},
 THREE:{name:'Rule of three', steps:['Headline','One','Two','Three','Close'], tip:'Announce three points up front, deliver them in order, close with the headline.'}
};
const CHUNKS = {
 opening:['The short answer is','Here is how I see it','The key point is','Let me start with the big picture'],
 reason:['The reason is','What that means is','This matters because','The main driver is'],
 example:['Take this example','A good example is','To make that concrete','Picture this'],
 contrast:['That said','On the other hand','The catch is','Where it gets interesting is'],
 close:['So the bottom line is','Which is why','If you remember one thing','That is why I would'],
 pause:['Let me think about that for a second','Good question, here is my take','Let me put it another way']
};

/* ================= QUESTION BANK =================
   Each line: <tier 1-4><context g|w|i|p|s>|<question>. Types decide which drills and frameworks a question can be used for.
   describe: paint a picture. story: a past experience (STAR-shaped). opinion: take and defend a position (PREP).
   explain: teach how or why something works. update: brief people on a situation (What / So what / Now what).
   change: how something has changed and where it's heading (Past / Present / Future). pitch: a problem to solve (Problem / Solution / Benefit).
   hostile: a challenging question to answer under pressure. talk: a short talk with three points (Rule of three). */
const QBANK_RAW = {
describe:`1g|Describe your ideal weekend in detail.
1g|Describe the place you grew up so I can picture it.
1g|Describe your morning routine and what you would change about it.
1g|Describe the best meal you have ever had.
1g|Describe your favourite place to think.
1g|Describe a room you spend a lot of time in.
1g|Describe a tool or app you use every day and why it earns its place.
1g|Describe your favourite season and what it is like where you live.
1g|Describe a hobby to someone who has never heard of it.
1g|Describe the best trip you have taken.
1g|Describe a photo that means a lot to you.
1g|Describe your perfect home office.
1s|Describe your closest friend without saying their name.
1s|Describe the last film or series you enjoyed without spoiling it.
1s|Describe a local spot you would take a visitor to.
1s|Describe your perfect evening with friends.
1w|Describe your workspace and how it affects your focus.
1w|Describe what a typical day in your job looks like.
1w|Describe the team you work with.
1i|Describe yourself in three words, then justify each one.
1p|Introduce yourself to a room of 50 people in under a minute.
1p|Introduce the topic you know most about as if opening a class.
2g|Describe a book, film or show that changed how you think.
2g|Describe a skill you have that most people don't.
2g|Describe the most interesting person you have met.
2g|Describe a city you would move to, and what draws you there.
2g|Describe a habit that has quietly improved your life.
2g|Describe a product you think is brilliantly designed.
2w|Describe a process at work that runs well, and what makes it work.
2w|Describe the best manager or teacher you have had.
2w|Describe your company's customers to someone outside the industry.
2i|Describe your working style to a future manager.
2s|Describe a tradition in your family or culture.
2s|Describe a moment you laughed so hard you couldn't stop.
2p|Introduce a guest speaker you admire to an audience.
3g|Describe a place so vividly that I feel I have been there.
3g|Describe a feeling most people struggle to put into words.
3g|Describe the atmosphere of a busy train station at rush hour.
3g|Describe something ordinary as if it were extraordinary.
3g|Describe a complex emotion you felt recently, precisely.

function pickQuestion(types, tier, r){
  const ctxs = new Set(['general', ...((S.profile&&S.profile.contexts)||[])]);
  const used = new Set(S.usedQ||[]);
  const all = qbank().filter(q=>types.includes(q.type) && ctxs.has(q.ctx));
  const tryPick = (list)=>{
    if(!list.length) return null;
    const personal = list.filter(q=>q.ctx!=='general');
    const src = personal.length && r()<0.55 ? personal : list;
    return src[Math.floor(r()*src.length)%src.length];
  };
  let q=null;
  for(const d of [0,1,-1,2,-2,3,-3]){ const t=tier+d; if(t<1||t>4) continue; q = tryPick(all.filter(x=>x.tier===t && !used.has(x.id))); if(q) break; }
  if(!q) q = tryPick(all) || qbank()[0];
  S.usedQ = [...(S.usedQ||[]), q.id].slice(-320);
  return q.text;
}

let _sprintIdx = null;
function sprintIndex(sid){
  _sprintIdx = _sprintIdx || {};
  if(_sprintIdx[sid]) return _sprintIdx[sid];
  const b = SPRINT_BANK[sid]; const single=[], multi=[];
  // Multi-word entries are the pairs we deliberately wrote; everything else is single.
  const MULTI = ['high priority','high stakes','fine tune','level up','stumbling block','point out','spell out','break down','account for','walk through','figure out','get it','high quality','first rate','well reasoned','well founded','evidence based','bring about','high speed','win over','talk into','wrap up','kick off','set up','worn out','burnt out','burned out','run down','thought provoking','in addition','for example','for instance','as a result','on the other hand','in contrast','in short','in conclusion','push back'];
  let rest = ' '+b.w+' ';
  for(const m of MULTI){ if(rest.includes(' '+m+' ')){ multi.push(m); rest = rest.replace(' '+m+' ',' '); } }
  for(const w of rest.trim().split(/\s+/)) if(w) single.push(w);
  return (_sprintIdx[sid] = {single:[...new Set(single)], multi, not:new Set(b.not||[])});
}
const SUFFIXES = ['','s','es','ed','d','ing','ly','er','est','ness','ment'];
function lemmaMatch(tok, e){
  if(tok===e) return true;
  if(tok.startsWith(e) && SUFFIXES.includes(tok.slice(e.length))) return true;
  if(e.endsWith('e') && tok.startsWith(e.slice(0,-1)) && ['ing','ed','er','est'].includes(tok.slice(e.length-1))) return true;
  if(e.endsWith('y') && ['ied','ies','ier','iest','ily'].includes(tok.slice(e.length-1)) && tok.startsWith(e.slice(0,-1))) return true;
  return false;
}
function sprintMatch(sid, text){
  const idx = sprintIndex(sid); const toks = norm(text).trim().split(' ').filter(Boolean);
  const valid = new Set(), other = new Set(); const used = new Array(toks.length).fill(false); let stop=0;
  // Multi-word answers first (first word may be inflected: "pointed out", "burned out").
  const multis = idx.multi.map(m=>m.split(' '));
  for(let i=0;i<toks.length;i++){
    for(const m of multis){
      if(i+m.length>toks.length) continue;
      if(lemmaMatch(toks[i], m[0]) && m.slice(1).every((w,j)=>toks[i+1+j]===w)){ valid.add(m.join(' ')); for(let j=0;j<m.length;j++) used[i+j]=true; break; }
    }
  }
  for(let i=0;i<toks.length;i++){
    if(used[i]) continue; const tok=toks[i];
    if(STOP.has(tok)){ stop++; continue; }
    if([...idx.not].some(n=>lemmaMatch(tok,n))) continue;
    const hit = idx.single.find(e=>lemmaMatch(tok,e));
    if(hit) valid.add(hit); else if(tok.length>2) other.add(tok);
  }
  return {valid:[...valid], other:[...other], stopRatio: toks.length ? stop/toks.length : 0, tokens: toks.length};
}

const DEPTH_NAMES = {1:'Facts', 2:'Experience', 3:'Feelings and motives', 4:'Meaning and values'};
const Q_OPEN = new Set(['what','whats','how','hows','why','tell','describe','which','where','when','who']);
const Q_CLOSED = new Set(['is','are','was','were','do','does','did','have','has','had','can','could','will','would','should','isnt','arent','didnt','dont','wont','wouldnt','havent','hasnt','may','might']);
const DEPTH_PATTERNS = {
  4:['mean to you','matter to you','important to you','did you learn','has it changed','did it change','change for you','changed for you','changed you','change you','changed about','taught you','do you want','who you','value','looking back','what would you tell','proud of','what does it say','hope for'],
  3:['feel','felt','why','what made you','what drew you','hardest','surprised','scared','excited','worried','nervous','how are you doing','how has that been','how is that','how was that for you','what was it about','what do you miss','decide','motivat'],
  2:['what was it like','what is it like','whats it like','tell me about','tell me more','how did it go','what happened','describe','best part','favourite','favorite','what stood out','how did you get into','what do you enjoy','what did you do']
};
function analyzeQuestion(text, prev){
  const w = words(text); const n=norm(text);
  let qi = w.findIndex((x,i)=>i<8 && (Q_OPEN.has(x.replace(/'/g,'')) || Q_CLOSED.has(x.replace(/'/g,''))));
  const isQ = qi>=0;
  const first = isQ ? w[qi].replace(/'/g,'') : '';
  const open = isQ && Q_OPEN.has(first) && !(first==='what' && ['time','day','date'].includes(w[qi+1]));
  const prevContent = new Set(contentWords(prev).map(x=>x.slice(0,5)));
  const overlap = contentWords(text).filter(x=>prevContent.has(x.slice(0,5))).length;
  const refers = /\b(that|it|this|they|she|he|there)\b/.test(w.slice(Math.max(0,qi),qi+10).join(' '));
  const follow = overlap>=1 || (isQ && refers);
  let depth = 1; for(const lv of [4,3,2]){ if(DEPTH_PATTERNS[lv].some(pt=>n.includes(' '+pt))){ depth=lv; break; } }
  if(!open && depth>2) depth = Math.max(2, depth-1);
  const selfWords = w.filter(x=>['i','me','my','myself',"i'm","i've",'im','ive'].includes(x)).length;
  const self = selfWords>=3 || /\b(me too|same with me|when i was|i also)\b/.test(n);
  const starts = (n.match(/\b(what|how|why|did you|do you|are you|was it|is it|have you)\b/g)||[]).length;
  const stacked = starts>=3;
  return {isQ, open, follow, depth, self, stacked};
}

/* ================= SPEECH ANALYSIS ENGINE ================= */
function countFillers(text){
  const n = norm(text); let total=0; const found={};
  for(const rx of FILLER_RX){ const m = n.match(rx); if(m){ total+=m.length; for(const x of m){ found[x]=(found[x]||0)+1; } } }
  const w = words(text);
  for(let i=0;i<w.length;i++){
    if(w[i]==='like'){
      const prev = (w[i-1]||'').replace(/'/g,''); const next = w[i+1]||'';
      if(!LIKE_OK_BEFORE.has(prev) && next!=='to' && next!=='that' && next!=='this' && next!=='a'){ total++; found['like']=(found['like']||0)+1; }
    }
  }
  for(let i=1;i<w.length;i++){ if(w[i]===w[i-1] && w[i].length<6 && !['that','had','very'].includes(w[i])){ total++; found['repeat: '+w[i]]=(found['repeat: '+w[i]]||0)+1; } }
  return {total, found};
}
function countPhrases(text, list){ const n=norm(text); let c=0; const hit=[]; for(const p of list){ const rx=new RegExp('\\b'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"'?")+'\\b','g'); const m=n.match(rx); if(m){ c+=m.length; hit.push(p);} } return {count:c, hit}; }
function mattr(w, win=25){
  if(w.length<2) return null;
  if(w.length<=win) return new Set(w).size/w.length;
  let sum=0, cnt=0;
  for(let i=0;i+win<=w.length;i++){ sum+=new Set(w.slice(i,i+win)).size/win; cnt++; }

function isPersonal(c){ return !!(c && c.custom && (c.src==='drill' || c.src==='coach')); }
function knownIn(deck,tier){ const cat=catalog(); return S.cards.filter(c=>!c.custom && c.deck===deck && cat[c.id] && cat[c.id].tier===tier && c.ivl>=3).length; }
function vocabWeek(){ return currentWeek((S.completed||0)+1); }
function tierUnlocked(deck,t){

function unlockHint(deck,t){

  return t===2?'Unlocks in week 2, or once you know 20 Tier 1 phrases.':t===3?'Unlocks in week 4, or once you know 20 Tier 2 phrases.':'';

function nextNew(deck, n, exclude){
  if(n<=0) return [];
  const cat=catalog(); const have=new Set(S.cards.map(c=>c.id)); const out=[];
  for(const id of (S.pins||[])){ if(out.length>=n) break; if(cat[id] && cat[id].deck===deck && !have.has(id) && !exclude.has(id)) out.push(id); }
  const tiers = (deck==='word'?[1,2,3,4]:[1,2,3]).filter(t=>tierUnlocked(deck,t));
  const pools = tiers.map(t=>({t, ids:Object.values(cat).filter(c=>c.deck===deck && c.tier===t && !have.has(c.id) && !exclude.has(c.id) && !out.includes(c.id)).map(c=>c.id)}));
  let i=0, confus=0;
  while(out.length<n){
    const main = pools.find(p=>p.ids.length && p.t!==4);
    const higher = pools.filter(p=>p.ids.length && p!==main && (p.t!==4 || confus<2));
    let pool = (i%4===3 && higher.length) ? higher[Math.floor(i/4)%higher.length] : (main || higher[0]);
    if(!pool) break;
    const id=pool.ids.shift(); out.push(id); if(pool.t===4) confus++; i++;
  }
  return out;
}
function dayQueue(deck, create=true){
  const t=todayStr(); const rec=todayRec(); rec.q = rec.q || {};
  if(rec.q[deck] || !create) return rec.q[deck] || null;
  const due = S.cards.filter(c=>c.deck===deck && c.due && c.due<=t);
  const pri = c => isPersonal(c)?0 : c.leech?1 : 2;
  due.sort((a,b)=>pri(a)-pri(b) || (a.due<b.due?-1:a.due>b.due?1:0));
  // Priority: your personal + sticky cards, then pinned cards, then reviews; always keep a few slots for new cards.
  const MIN_NEW = 3;
  const cat=catalog(); const have=new Set(S.cards.map(c=>c.id));
  const pins=(S.pins||[]).filter(id=>cat[id] && cat[id].deck===deck && !have.has(id)).slice(0,5);
  const urgent=due.filter(c=>pri(c)<2).map(c=>c.id), rest=due.filter(c=>pri(c)===2).map(c=>c.id);
  const ids=urgent.slice(0,DAILY_CARDS);
  for(const id of pins) if(ids.length<DAILY_CARDS) ids.push(id);
  const avail = nextNew(deck, DAILY_CARDS, new Set(ids)).length;
  const reserve = Math.min(MIN_NEW, avail);
  for(const id of rest) if(ids.length<DAILY_CARDS-reserve) ids.push(id);
  const fresh = nextNew(deck, DAILY_CARDS-ids.length, new Set(ids));
  const pinned=ids.filter(id=>pins.includes(id)).length;
  rec.q[deck] = {ids:[...ids,...fresh], pos:0, fresh:fresh.length+pinned, due:ids.length-pinned, again:{}, stats:{seen:0, missed:0, learned:0, personal:0, leech:0, recovered:0, graduated:0}};
  save(); return rec.q[deck];
}
function queuePreview(deck){
  const q = dayQueue(deck,false);
  if(q) return {left:Math.max(0,q.ids.length-q.pos), total:q.ids.length, due:q.due, fresh:q.fresh, started:q.pos>0};
  const t=todayStr(); const due=Math.min(DAILY_CARDS, S.cards.filter(c=>c.deck===deck && c.due && c.due<=t).length);
  const fresh = nextNew(deck, DAILY_CARDS-due, new Set()).length;
  return {left:due+fresh, total:due+fresh, due, fresh, started:false};
}
function ensureCardState(id){
  let c=cardState(id); if(c) return c;
  const base=catalog()[id]; if(!base) return null;
  c={id, deck:base.deck, ease:2.5, ivl:0, due:todayStr(), reps:0, lapses:0, added:todayStr()};

}
function gradeCard(c,g){
  const t=todayStr(); c.seen=t; c.ease=c.ease||2.5; const personal=isPersonal(c); let res=null;
  if(g===0){
    c.lapses=(c.lapses||0)+1; c.ivl=0; c.reps=0; c.ease=Math.max(1.3,c.ease-0.2); c.due=t; c.okStreak=0; c.easyStreak=0;
    if(c.lapses>=3 && !c.leech){ c.leech=true; res='leech'; }
    return res;
  }
  c.reps=(c.reps||0)+1;
  if(g===1){ c.ivl=Math.max(1,Math.round((c.ivl||1)*1.2)); c.ease=Math.max(1.3,c.ease-0.15); c.okStreak=0; c.easyStreak=0; }
  else if(g===2){ c.ivl = c.reps===1?1 : c.reps===2?3 : Math.max(1,Math.round((c.ivl||1)*c.ease)); c.okStreak=(c.okStreak||0)+1; c.easyStreak=0; }
  else { c.ivl = c.reps===1?3 : Math.max(3,Math.round((c.ivl||1)*c.ease*1.3)); c.ease+=0.15; c.okStreak=(c.okStreak||0)+1; c.easyStreak=(c.easyStreak||0)+1; }
  if(c.leech && c.okStreak>=2){ c.leech=false; c.lapses=1; res='recovered'; }
  if(personal){ if((c.easyStreak||0)<2) c.ivl=1; else if(c.easyStreak===2) res=res||'graduated'; }
  c.due=addDays(t,c.ivl);

}

function hintFor(v){

function snippetAround(text, pat, span=5){

function gradeCurrent(g){

  if(res==='leech') st.leech++; if(res==='recovered') st.recovered++; if(res==='graduated') st.graduated++;

/* ================= AI COACH (Claude via sample capability) ================= */
let coachCtl = null;
function coachAvailable(){ return !!SAMPLE || !!(S && S.settings.apiKey); }
async function askJSON(prompt, tier){
  if(SAMPLE) return await SAMPLE.json(prompt, {signal: coachCtl.signal, modelTier: tier||'default'});
  if(!S.settings.apiKey) throw {code:'unavailable'};
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST', signal: coachCtl.signal,
      headers:{'content-type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model: S.settings.model || 'claude-sonnet-5', max_tokens: 1500, messages:[{role:'user', content: prompt}]})});
  }catch(e){ if(e && e.name==='AbortError') throw {code:'cancelled'}; throw {code:'network'}; }
  if(res.status===401 || res.status===403) throw {code:'bad_key'};
  if(res.status===429) throw {code:'rate_limited'};
  if(!res.ok) throw {code:'api_error', status:res.status};
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const clean = text.replace(/```json|```/g,'').trim();
  try{ return JSON.parse(clean); }catch(e){}
  const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
  if(a>=0 && b>a){ try{ return JSON.parse(clean.slice(a,b+1)); }catch(e){} }
  throw {code:'invalid_json'};
}
function coachContext(){
  const p = S.profile||{};
  return `Speaker profile: ${p.name||'the user'}, age 26, wants to become far more articulate. Contexts they care about: ${(p.contexts||[]).join(', ')||'general'}. Self-rated speaking anxiety: ${p.anxiety}/10. ${p.goal?('Their goal: '+p.goal+'.'):''} Weakest skill right now: ${S.skills?SKILLS[weakestSkill()].name:'unknown'}.`;
}
function drillBrief(d){
  const map = {awareness:'Impromptu speech; focus is noticing and removing fillers.', precision:'Speech with banned vague words (thing, stuff, very, really, good, nice, a lot, basically). Precision is the focus.', framework:`Answer must follow the ${d.fw?FRAMEWORKS[d.fw].name:''} framework (${d.fw?FRAMEWORKS[d.fw].steps.join(' > '):''}). Judge structure strictly against it.`, chunks:`Speech that must naturally use these signpost phrases: ${(d.chunks||[]).join('; ')}.`, f432:'Final, shortest round of a 4/3/2 repetition (same content delivered in less time).', impromptu:'Near zero-prep impromptu speech.', compress:'Final round of a compression ladder: the speaker had to say the essence in one sentence.', qa:'Response to a hostile question. Judge composure, directness and whether they actually answered.', talk:'A short talk using the rule of three. Judge structure, flow and memorability.'};
  return map[d.type] || 'Impromptu speech.';
}
const TRANSCRIPT_NOTE = 'Transcript from automatic speech recognition: no punctuation, possible mis-hearings, and sounds like "um" are often dropped. Do not judge punctuation or obvious mis-hearings.';
const CHECK_RULES = `Answer each check literally, judging only what is in the transcript: 1 = yes, 0 = no, null = not applicable (only where the check allows it). Do not reward length, effort or tone. When unsure, answer 0.`;
function checkJSONShape(d){ return `"checks":{${checksFor(d).map(c=>`"${c.id}":1|0${c.na?'|null':''}`).join(',')}},"why":{"<id of each check answered 0>":"under 12 words, quoting the transcript where possible"}`; }
async function coachFeedback(d, transcript, m){
  if(!coachAvailable()) throw {code:'unavailable'};
  coachCtl = new AbortController();
  const prompt = `You are an elite speaking coach grounded in psycholinguistics. You assess a spoken answer with a fixed checklist, then give sharp, specific, encouraging feedback.

${coachContext()}
Drill: ${drillBrief(d)}
Prompt they spoke to: "${d.topic}"
Measured by the app: ${m.words} words in ${m.sec}s, ${m.wpm} words/min, ${m.fpm} fillers/min, vague-word rate ${m.vagueRate}%, hedge rate ${m.hedgeRate}%.
${TRANSCRIPT_NOTE}
"""${transcript.slice(0,4000)}"""

CHECKLIST
${checklistPrompt(d)}
${CHECK_RULES}

Reply with only a JSON object, no other text:
{"main_point":"their main point in one sentence, or an empty string if none can be identified",
${checkJSONShape(d)},
"headline":"one sentence naming their single biggest problem honestly, or their biggest win if the checklist is almost all 1s",
"strengths":["1-2 specific things done well"],
"fixes":[{"issue":"short name","you_said":"a short exact quote from the transcript","try":"a sharper way to say it"}],
"rewrite":"the same ideas said articulately in the speaker's own voice, spoken register, no longer than their version, max 90 words",
"power_words":[{"word":"a precise word or phrase that would have upgraded this speech","meaning":"plain definition","example":"example sentence"}],
"next_rep":"one concrete instruction for the next attempt"}
Give 2-3 fixes tied to failed checks, most important first, and 2-3 power_words.`;
  const r = await askJSON(prompt);
  const merged = mergeChecks([r]);
  return merged ? {...r, checks:merged.checks, why:r.why||{}} : r;
}
async function judgeOnly(d, transcript){
  const ctl = new AbortController(); const prev = coachCtl; coachCtl = ctl;
  const prompt = `You assess a spoken answer against a fixed checklist.
Prompt they spoke to: "${d.topic}"
${TRANSCRIPT_NOTE}
"""${transcript.slice(0,4000)}"""

CHECKLIST
${checklistPrompt(d)}
${CHECK_RULES}

Reply with only a JSON object:
{"main_point":"their main point in one sentence, or empty if none", ${checkJSONShape(d)}}`;
  try{ return await askJSON(prompt); } finally { if(coachCtl===ctl) coachCtl = prev; }
}
async function judgeRuns(d, transcript, runs){
  const outs = await Promise.all(Array.from({length:runs}, ()=>judgeOnly(d, transcript).catch(()=>null)));
  return mergeChecks(outs);
}
async function coachProfile(tA, tC, jA, jC, mA, mC, sprintCount){
  if(!coachAvailable()) throw {code:'unavailable'};
  coachCtl = new AbortController();
  const failed = j => j ? CHECKS.filter(c=>j.checks[c.id]!=null && j.checks[c.id]<0.5).map(c=>`${c.short}${j.why&&j.why[c.id]?' ('+j.why[c.id]+')':''}`).join('; ') || 'none' : 'not judged';
  const prompt = `You are an elite speaking coach. Summarise this person's starting point from their assessment.

${coachContext()}
Task 1, impromptu opinion. Failed checks: ${failed(jA)}. Delivery: ${mA.wpm} wpm, ${mA.fpm} fillers/min.
Transcript: """${tA.slice(0,2000)}"""
Task 2, word sprint: ${sprintCount} valid words in 45 seconds.
Task 3, explain something simply. Failed checks: ${failed(jC)}. Delivery: ${mC.wpm} wpm, ${mC.fpm} fillers/min.
Transcript: """${tC.slice(0,2000)}"""
${TRANSCRIPT_NOTE}

Reply with only a JSON object:
{"summary":"2-3 sentences, specific, honest and kind; if they rambled or were hard to follow, say so plainly",
"strengths":["2 specific strengths"],
"priorities":[{"skill":"one of fluency|retrieval|structure|precision|concision|delivery|composure|curiosity","why":"one sentence citing evidence"}],
"first_week_focus":"one sentence"}
Give exactly 3 priorities, most important first, grounded in the failed checks.`;
  return await askJSON(prompt);

function coachErrText(e){

  const base = key==='idx' ? S.baseline.index : S.baseline.delivery;
  const rn = rollingNow(key); const d = rn && base!=null ? rn.avg-base : null;
  const series = rollingSeries([...(base!=null?[base]:[]), ...vals]).slice(-15);
  return `<button class="item" data-a="go" data-v="progress" aria-label="Open progress"><span class="grow"><span class="small muted">${key==='idx'?'Your level':'Your delivery level'}${rn?`, last ${rn.n} reps`:''}</span><br><span class="t" style="font-family:var(--display);font-size:1.4rem">${rn?rn.avg:(base??'\u2013')}</span> <span class="pill ${d==null?'':d>=0?'good':'bad'}">${d==null?'baseline':(d>=0?'+':'')+d+' vs start'}</span>${rn&&rn.n>=2?`<br><span class="tiny muted">Range ${rn.lo}\u2013${rn.hi}</span>`:''}</span><span style="color:var(--accent)">${sparkline(series)}</span><span class="muted">\u203A</span></button>`;
}

function sidOf(rd){ if(rd && rd.sid!=null) return rd.sid; return rd ? SPRINT_BANK.findIndex(b=>b.p===rd.topic) : -1; }
const CHECK_FORMS = [
 {q:'Is it better to be a specialist or a generalist?', sid:0},

 {q:'Is talent or practice more important for success?', sid:3},

function assessRounds(form){
  const f = CHECK_FORMS[(form||0) % CHECK_FORMS.length];
  return [
    {label:'Task 1 of 3: Impromptu opinion', topic:f.q, prep:20, sec:60, mode:'speak'},
    {label:'Task 2 of 3: Word sprint', topic:SPRINT_BANK[f.sid].p, sid:f.sid, prep:0, sec:45, mode:'sprint'},

  ];
}
function roundsFor(it){
  switch(it.type){
    case 'sprint': return [{topic:it.topic, sid:it.sid, prep:0, sec:it.sec, mode:'sprint'}];
    case 'f432': return it.rounds.map((s,i)=>({topic:it.topic, prep:i?0:it.prep, sec:s, mode:'speak', instruction:['Round 1: say it fully, with every key point.','Round 2: the same content in 25% less time. Keep every key point.','Round 3: the same content in half the original time. Faster, not sloppier.'][i]}));
    case 'curious': return [0,1,2].map(i=>({topic:i===0?it.topic:'', prep:0, sec:it.sec, mode:'question'}));
    case 'compress': return [[60,'Explain it fully.'],[30,'Same ideas, half the time. Cut the warm-up and lead with the point.'],[15,'One sentence. The essence only.']].map(([s,ins],i)=>({topic:it.topic, prep:i?0:it.prep, sec:s, mode:'speak', instruction:ins}));
    default: return [{topic:it.topic, prep:it.prep, sec:it.sec, mode:'speak'}];

function startRun(i){

  else if(it.type==='checkpoint') RUN={kind:'check', idx:i, item:{type:'checkpoint'}, rounds:assessRounds(S.checkpoints.length+1), r:0, phase:'intro', results:[], taps:0};

  view='run'; render(); window.scrollTo(0,0);
}

function mergeM(a,c){ const o={}; for(const k of ['fpm','wpm','mattr','vagueRate','hedgeRate','lppm','mlr','latency','words']){ const v=avg([a[k],c[k]]); o[k]= v==null?null: (k==='mattr'?round(v,3):k==='wpm'||k==='words'?Math.round(v):round(v,1)); } return o; }
async function finalizeAssess(){
  const A=RUN.results[0], B=RUN.results[1], C=RUN.results[2];
  RUN.phase='processing'; RUN.procMsg = coachAvailable() ? 'Your coach is scoring each answer twice for consistency. This can take up to a minute.' : 'Building your profile'; RUN.procSkip=coachAvailable(); render();
  let jA=null, jC=null, prof=null;
  if(coachAvailable() && (A.m.words+C.m.words)>=15){
    const dA={type:'assess', topic:A.topic}, dC={type:'assess', topic:C.topic};
    try{ [jA, jC] = await Promise.all([judgeRuns(dA, A.text, 2), judgeRuns(dC, C.text, 2)]); }catch(e){}
    if(!RUN) return;
    if(jA || jC){ RUN.procMsg='Writing your profile'; render(); try{ prof = await coachProfile(A.text, C.text, jA, jC, A.m, C.m, B.count); }catch(e){ prof=null; } }
  }
  if(!RUN) return;
  const sA=scoreRep(A.m, jA), sC=scoreRep(C.m, jC);
  const both = sA.index!=null && sC.index!=null;
  const idx = both ? Math.round(avg([sA.index, sC.index])) : null;
  const dly = Math.round(avg([sA.delivery, sC.delivery])); const cnt = both ? Math.round(avg([sA.content, sC.content])) : null;
  const mm = mergeM(A.m, C.m);
  const pil = {}; for(const k of Object.keys(PILLAR_NAMES)){ const v=avg([A.m.pillars[k], C.m.pillars[k]]); pil[k] = v==null?null:Math.round(v); } pil.judged = both;
  const agreement = avg([jA&&jA.agreement, jC&&jC.agreement]);
  const coach = prof ? {...prof, main_point_task1: jA?jA.main_point:'', checksA:jA, checksC:jC} : (jA||jC ? {main_point_task1: jA?jA.main_point:'', checksA:jA, checksC:jC} : null);
  const rec = {v:SCORE_V, date:todayStr(), index:idx, delivery:dly, content:cnt, agreement, pillars:pil, fpm:mm.fpm, wpm:mm.wpm, mattr:mm.mattr, vagueRate:mm.vagueRate, hedgeRate:mm.hedgeRate, lppm:mm.lppm, mlr:mm.mlr, latency:mm.latency, sprint:B.count, mA:{...mm, sub:null}, coach, form:RUN.kind==='assess'?0:S.checkpoints.length+1};
  if(RUN.kind==='assess'){
    const sa=A.m.sub, sc=C.m.sub;
    const sk = {
      fluency: avg([sa.fluency, sc.fluency]), retrieval: avg([avg([sa.lexical,sc.lexical]), clamp(B.count/20*100)]),
      structure: pil.clarity, precision: avg([avg([sa.vague,sc.vague]), pil.precision]),
      concision: pil.concision, delivery: avg([sa.rate,sc.rate,sa.pause,sc.pause]), composure: avg([avg([sa.hedge,sc.hedge]), 100-S.profile.anxiety*8]), curiosity: 50
    };
    for(const k in sk) sk[k] = sk[k]==null ? 50 : Math.round(clamp(sk[k]));
    S.skills = sk; S.baseSkills = {...sk}; S.baseline = rec;
    const ref = idx ?? dly-10; const base = ref>70?4:ref>58?3:ref>45?2:1; S.levels={}; for(const k of Object.keys(DRILL_META)) S.levels[k]=base; S.levels.sprint = B.count>=14?3:B.count>=9?2:1; S.levels.curious=1;
    S.days = {}; save(); stopRunTimers(); RUN=null; view='report'; render(); window.scrollTo(0,0); return;
  }
  S.checkpoints.push(rec); applyObservations(A.m); applyObservations(C.m); updateSkill('retrieval', clamp(B.count/20*100));
  S.history.push({d:todayStr(), v:SCORE_V, t:'checkpoint', idx, dly, cnt, fpm:mm.fpm, wpm:mm.wpm, mattr:mm.mattr, vague:mm.vagueRate, lppm:mm.lppm, words:mm.words});
  save(); RUN.checkRec=rec; RUN.applied=true; RUN.phase='checkres'; render();
}
function markDone(){
  if(RUN && RUN.idx>=0){
    const rec=todayRec(); if(!rec.done.includes(RUN.idx)) rec.done.push(RUN.idx);
    if(!rec.complete && rec.done.length>=rec.plan.items.length){
      rec.complete=true; S.completed++; S.doneDates=(S.doneDates||[]); if(!S.doneDates.includes(todayStr())) S.doneDates.push(todayStr());
      const y=addDays(todayStr(),-1); S.streak = (S.lastDone===y||S.lastDone===todayStr()) ? S.streak+(S.lastDone===todayStr()?0:1) : 1; S.lastDone=todayStr();
    }
    save();
  }
}
/* ================= ACTIONS ================= */
const A = {
  go(v){ if(view==='onboard') return; confirmReset=false; view=v; render(); window.scrollTo(0,0); },
  obctx(v){ readOB(); OB.contexts = OB.contexts.includes(v) ? OB.contexts.filter(x=>x!==v) : [...OB.contexts, v]; render(); },
  obmin(v){ readOB(); OB.minutes=+v; render(); },
  obdone(){ readOB(); S.profile={name:OB.name, contexts:OB.contexts, minutes:OB.minutes, anxiety:OB.anxiety, goal:OB.goal}; if(!SR) S.settings.input='dictate'; save(); view='today'; render(); window.scrollTo(0,0); },
  startassess(){ startAssess(); },
  run(v){ startRun(+v); },
  exit(){ if(RUN){ stopRunTimers(); if(RUN.cap){ RUN.cap.stop(); RUN.cap=null; } if(coachCtl) try{ coachCtl.abort(); }catch(e){} } RUN=null; view=S.baseline?'today':'today'; render(); window.scrollTo(0,0); },
  ready(){ const rd=curRound(); if(rd.prep) beginPrep(); else beginCount(); },
  startspeak(){ stopRunTimers(); beginSpeak(); },
  tap(){ RUN.taps++; const b=$('#tapbtn'); if(b) b.textContent=`I said a filler (${RUN.taps})`; if(S.settings.vibrate && navigator.vibrate) try{ navigator.vibrate(30); }catch(e){} },
  finish(){ finishRound(); },
  todict(){ if(RUN.cap){ RUN.cap.stop(); RUN.cap=null; } RUN.dictation=true; const keep=RUN.endAt; render(); RUN.endAt=keep; },
  nextround(){ RUN.r++; const rd=curRound(); if(RUN.kind!=='drill'){ RUN.phase='intro'; render(); window.scrollTo(0,0); return; } if(rd.prep) beginPrep(); else beginCount(); },
  coachskip(){ if(coachCtl) try{ coachCtl.abort(); }catch(e){} if(RUN && RUN.coachState==='loading'){ RUN.coachState='error'; RUN.coachErr='Coach feedback skipped for this rep.'; applyResults(); render(); } },
  rehearse(){ const w=words(RUN.coach.rewrite).length; RUN.retryRound={topic:'Say the sharper version from memory, in your own words.', prep:0, sec:Math.round(clamp(w/2.2+10,25,90)), mode:'speak'}; RUN.phase='study'; RUN.endAt=Date.now()+20000; render(); window.scrollTo(0,0); },
  hidestudy(){ stopRunTimers(); RUN.retryMode=true; beginCount(); },
  done(){ if(RUN && RUN.kind==='drill' && !RUN.applied){ if(coachCtl) try{ coachCtl.abort(); }catch(e){} RUN.coachState='error'; applyResults(); } markDone(); stopRunTimers(); RUN=null; view='today'; render(); window.scrollTo(0,0); },
  warmnext(){ if(RUN.step<2){ RUN.step++; render(); } else { A.done(); } },
  reveal(){ if(Date.now()<RUN.lockUntil) return; RUN.revealed=true; render(); },
  grade(v){ gradeCurrent(+v); RUN.revealed=false; RUN.lockUntil=Date.now()+3000; render(); window.scrollTo(0,0); },
  morecards(){ const q=RUN.q; const add=nextNew(RUN.deck,5,new Set(q.ids)); q.ids.push(...add); q.fresh+=add.length; save(); RUN.note=''; render(); },
  pin(id){ S.pins=S.pins||[]; if(S.pins.includes(id)) S.pins=S.pins.filter(x=>x!==id); else S.pins.push(id); const rec=S.days[todayStr()]; save(); const el=document.querySelector('#liblist'); if(el){ const open=[...el.querySelectorAll('details[open]')].map(d=>d.querySelector('summary').textContent); el.innerHTML=libList(); el.querySelectorAll('details').forEach(d=>{ if(open.includes(d.querySelector('summary').textContent)) d.open=true; }); } },
  libdeck(v){ LIB.deck=v; LIB.filter='all'; render(); },
  libfilter(v){ LIB.filter=v; render(); },
  ptab(v){ progTab=v; render(); },
  savekey(){ S.settings.apiKey=$('#apikey').value.trim(); S.settings.model=$('#apimodel').value.trim()||'claude-sonnet-5'; save(); const m=$('#keymsg'); if(m) m.textContent=S.settings.apiKey?'Saved. Coach is on.':'Key removed. Coach is off.'; },
  async testkey(){ A.savekey(); const m=$('#keymsg'); if(!S.settings.apiKey){ return; } m.textContent='Testing\u2026'; coachCtl=new AbortController(); try{ const r=await askJSON('Reply with only this JSON: {"ok":true}'); m.textContent = r&&r.ok ? 'Connected. Coach is on.' : 'Connected, but the reply was unexpected.'; }catch(e){ m.textContent = e.code==='bad_key'?'That key was rejected.': e.code==='network'?'Could not reach the API. Check your connection.': e.code==='api_error'?`The API returned an error (${e.status}). Check the model name.`:'Test failed: '+(e.code||'unknown'); } },
  async export(){ const blob=new Blob([JSON.stringify({...S, settings:{...S.settings, apiKey:''}})],{type:'application/json'}); const name='lucid-backup-'+todayStr()+'.json'; const msg=$('#bkmsg');
    try{ const f=new File([blob],name,{type:'application/json'}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:'Lucid backup'}); if(msg) msg.textContent='Backup shared. Save it to Files or iCloud Drive.'; return; } }catch(e){ if(e && e.name==='AbortError') return; }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); if(msg) msg.textContent='Backup downloaded.'; },
  import(){ const f=$('#importfile'); if(f) f.click(); },
  async constest(v){
    const el=$('#constest'); if(!el) return;
    const src = v==='last' && S.lastRep ? S.lastRep : {type:'framework', fw:'PREP', topic:'Should people work from home or in the office?', text:'so I think working from home is mostly better because um you save the commute which is like an hour a day for most people and you can focus better without interruptions but it depends on the person because some people get lonely so I guess a mix is probably best like two days in the office and three at home so yeah I think hybrid is the answer'};
    const d={type:src.type, fw:src.fw, topic:src.topic};
    el.innerHTML='<div class="row"><div class="spinner" style="width:20px;height:20px;border-width:3px"></div><span>Scoring three times\u2026</span></div>';
    const outs = await Promise.all([0,1,2].map(()=>judgeOnly(d, src.text).catch(()=>null)));
    const ok = outs.filter(o=>o&&o.checks); if(!ok.length){ el.textContent='The coach couldn\u2019t be reached. Try again in a moment.'; return; }
    const scores = ok.map(o=>contentFrom(mergeChecks([o]).checks).content);
    const m = mergeChecks(ok); const spread = Math.max(...scores)-Math.min(...scores);
    el.innerHTML = `<p>Content scores: <b>${scores.join(', ')}</b>. Spread: <b>${spread} points</b>.</p><p>Checks answered identically every time: <b>${m.agreement!=null?Math.round(m.agreement*100):'\u2013'}%</b>.</p><p class="tiny muted">${spread<=8?'Consistent: differences this small are normal and are smoothed out by the 5-rep average.':'Some variation. Borderline answers flip a check or two; the rolling average and double-checked assessments absorb this.'}</p>`;
  },
  toggle(k){ S.settings[k]=!S.settings[k]; save(); render(); },
  input(v){ S.settings.input=v; save(); render(); },
  setmin(v){ S.profile.minutes=+v; save(); render(); },
  setctx(v){ const c=S.profile.contexts; S.profile.contexts = c.includes(v)?c.filter(x=>x!==v):[...c,v]; save(); render(); },
  reset(){ confirmReset=true; render(); },
  resetcancel(){ confirmReset=false; render(); },
  retake(){ S.baseline=null; S.baseSkills=null; S.skills=null; S.levels={}; S.history=[]; S.checkpoints=[]; S.days={}; S.completed=0; S.streak=0; S.lastDone=null; S.doneDates=[]; save(); view='today'; render(); window.scrollTo(0,0); },
  resetconfirm(){ const keep=S.settings; S=freshState(); S.settings=keep; confirmReset=false; OB={name:'', contexts:['work'], minutes:15, anxiety:5, goal:''}; save(); view='onboard'; render(); window.scrollTo(0,0); }
};
document.addEventListener('click', e=>{ const el=e.target.closest('[data-a]'); if(!el || el.disabled) return; const f=A[el.dataset.a]; if(f){ e.preventDefault(); f(el.dataset.v, el); } });
document.addEventListener('change', async e=>{ if(e.target.id!=='importfile') return; const file=e.target.files[0]; if(!file) return; const msg=$('#bkmsg');
  try{ const data=JSON.parse(await file.text()); if(!data || !data.v || !data.profile) throw 0; const key=S.settings.apiKey, model=S.settings.model; S=Object.assign(freshState(), data); S.settings=Object.assign(freshState().settings, data.settings||{}, {apiKey:key, model}); save(); view='today'; render(); window.scrollTo(0,0); }
  catch(err){ if(msg) msg.textContent='That file isn\u2019t a Lucid backup.'; } });
document.addEventListener('input', e=>{ if(e.target.id==='libsearch'){ LIB.q=e.target.value.trim(); const el=$('#liblist'); if(el) el.innerHTML=libList(); return; } if(e.target.id==='obAnx'){ OB.anxiety=+e.target.value; const v=$('#obAnxV'); if(v) v.textContent=OB.anxiety+'/10'; } });

/* ================= INIT ================= */
(async function init(){
  let loaded=null; try{ loaded = await loadState(); }catch(e){}
  S = loaded && loaded.v ? Object.assign(freshState(), loaded) : freshState();
  S.settings = Object.assign(freshState().settings, S.settings||{});
  if(S.profile && !S.profile.contexts) S.profile.contexts=[];
  migrateCards();
  if(S.skills && S.skills.curiosity==null) S.skills.curiosity=50;
  view = S.profile ? 'today' : 'onboard';
  render();
  if(store.mode!=='cloud' && navigator.storage && navigator.storage.persist){ try{ navigator.storage.persist(); }catch(e){} }
  if('serviceWorker' in navigator && location.protocol==='https:' && !window.claude){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
